name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------
  # JOB 1: Test and Lint the FastAPI Backend Agent
  # ----------------------------------------------------
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up subsequent runs

      # Only install and run if backend files actually changed
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8

      - name: Lint Code with Flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Backend Unit Tests
        run: |
          # Runs any tests matching test_*.py in your backend folder
          pytest

  # ----------------------------------------------------
  # JOB 2: Test and Build the React Frontend
  # ----------------------------------------------------
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-node: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build Production Bundle
        run: npm run build

  # ----------------------------------------------------
  # JOB 3: Continuous Deployment (CD)
  # ----------------------------------------------------
  deploy:
    needs: [backend-ci, frontend-ci] # Only deploy if both apps pass tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Example: Triggering a webhook deployment (Works perfectly for Render / Railway / Webapp environments)
      - name: Deploy Backend via Webhook
        run: |
          curl -X POST "${{ secrets.BACKEND_DEPLOY_WEBHOOK }}"
          
      - name: Deploy Frontend via Webhook
        run: |
          curl -X POST "${{ secrets.FRONTEND_DEPLOY_WEBHOOK }}"
