name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------
  # JOB 1: Test and Lint the FastAPI Backend Agent
  # ----------------------------------------------------
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Point explicitly to your backend directory caching setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8

      - name: Lint Code with Flake8
        working-directory: ./backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ----------------------------------------------------
  # JOB 2: Test and Build the React Frontend
  # ----------------------------------------------------
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Fixed typo here from 'node-node' to 'node-version' and upgraded to Node 22
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Initialize Dummy Package Lock if missing
        working-directory: ./frontend
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only; fi

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Bundle
        working-directory: ./frontend
        run: npm run build --if-present

  # ----------------------------------------------------
  # JOB 3: Continuous Deployment (CD)
  # ----------------------------------------------------
  deploy:
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dry Run Deployment Notification
        run: echo "Code validated successfully! Waiting for webhook configuration keys to trigger real hosting pushes."
